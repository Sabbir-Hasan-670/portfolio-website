<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== PRIMARY SEO ===== -->
    <title>Blog &amp; Resources | Sabbir Hasan</title>
    <meta name="description" content="Read practical guides, tutorials, and insights on digital marketing, design, networking, and technology by Sabbir Hasan.">
    <meta name="keywords" content="Sabbir Hasan blog, digital marketing, graphic design, networking, tech articles">
    <meta name="author" content="Sabbir Hasan">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sabbirhasan.com/blog">
    <!-- Google Search Console verification: <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE"> -->

    <!-- ===== OPEN GRAPH ===== -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sabbirhasan.com/blog">
    <meta property="og:title" content="Blog &amp; Resources | Sabbir Hasan">
    <meta property="og:description" content="Read practical guides, tutorials, and insights on digital marketing, design, networking, and technology by Sabbir Hasan.">
    <meta property="og:image" content="https://sabbirhasan.com/og-image.png">
    <meta property="og:site_name" content="Sabbir Hasan Portfolio">

    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog &amp; Resources | Sabbir Hasan">
    <meta name="twitter:description" content="Read practical guides, tutorials, and insights on digital marketing, design, networking, and technology by Sabbir Hasan.">
    <meta name="twitter:image" content="https://sabbirhasan.com/og-image.png">

    <!-- ===== MOBILE ===== -->
    <meta name="theme-color" content="#060913">

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="/favicon.png?v=1">

    <!-- ===== PERFORMANCE ===== -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://sabbirhasan.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Blog",
          "item": "https://sabbirhasan.com/blog"
        }
      ]
    }
    </script>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="aurora-mesh">
        <div class="aurora-blob aurora-blob-1"></div>
        <div class="aurora-blob aurora-blob-2"></div>
        <div class="aurora-blob aurora-blob-3"></div>
    </div>
    <canvas id="starCanvas"></canvas>

    <div class="main-content">
        <nav class="navbar" id="navbar">
            <div class="nav-inner">
                <a href="/#home" class="nav-logo">SH.</a>
                <div class="nav-links" id="navLinks">
                    <a href="/" class="nav-visible-btn">Home</a>
                    <a href="/blog" class="nav-visible-btn" style="color:var(--aurora-1);">Blog</a>
                    <button class="hamburger" id="hamburger" aria-label="Menu">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="nav-menu-dropdown" id="navDropdown">
                        <a href="/#about">About</a>
                        <a href="/#projects">Projects</a>
                        <a href="/#experience">Experience</a>
                        <a href="/#education">Education</a>
                        <a href="/#contact" class="nav-cta">Let's Talk</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="section" style="padding-top:3rem;">
            <div class="section-header reveal">
                <p class="section-label">Blog</p>
                <h1 class="section-title">Latest <span>Articles</span></h1>
            </div>

            <div class="category-filters" id="categoryFilters">
                <button class="cat-btn active" data-category="all">All</button>
            </div>

            <div class="blog-grid" id="blogGrid">
                <p style="color:var(--text2);">Loading articles...</p>
            </div>

            <div class="pagination" id="pagination">
                <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Load More Posts →</button>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; <span id="year"></span> Sabbir Hasan. Built with ❤️</p>
        </footer>
    </div>

    <script src="main.js" defer></script>
    <script src="/toast.js" defer></script>
</body>
</html>
